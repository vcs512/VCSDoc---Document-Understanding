[project]
name = "vcsdoc-document-understanding"
version = "0.1.0"
description = "Document understanding and information retrieval techniques benchmarked on the CORD dataset."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0.1",
    "matplotlib>=3.11.1",
    "mlflow>=3.16.0",
    "nltk>=3.10.3",
    "onnx>=1.22.0; platform_system == 'Linux'",
    "onnxruntime-gpu>=1.29.0; platform_system == 'Linux'",
    "opencv-python>=4.10.0",
    "optimum>=2.3.0",
    "paddleocr==2.9.1; platform_system == 'Linux'",
    "paddlepaddle==2.6.2; platform_system == 'Linux'",
    "pandas>=3.0.5",
    "peft>=0.20.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.0",
    "spacy>=3.8.16",
    "timm>=1.0.29",
"torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.0",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff]
target-version = "py311"
line-length = 80
extend-exclude = ["data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
